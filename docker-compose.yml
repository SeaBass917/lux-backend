services:
  db:
    image: "postgres:latest"
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "log_statement=all"]
    networks:
      - shared-local-net

  api:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.api
    container_name: api
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./server:/app/lux:rw
      - ./media:/app/media:rw
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - shared-local-net

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT_OUT}:${REDIS_PORT_IN}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - shared-local-net

  celery-worker:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.api
    volumes:
      - ./server:/code/lux
    command: ["celery", "-A", "lux", "worker", "-l", "info"]
    depends_on:
      - redis
      - api
    networks:
      - shared-local-net

  celery-beat:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.api
    volumes:
      - ./server:/code/lux
    command: ["celery", "-A", "lux", "beat", "-l", "info"]
    depends_on:
      - redis
      - api
    networks:
      - shared-local-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      # Add your certs and other volumes as needed
    env_file:
      - .env
    entrypoint: /bin/sh -c "envsubst < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    depends_on:
      - db
      - api
    networks:
      - shared-local-net

volumes:
  certs:
    driver: local
  postgres_data:
    driver: local

networks:
  shared-local-net:
    driver: bridge