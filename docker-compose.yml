# Base docker-compose configuration
# Shared services across all environments
services:
  db:
    image: "postgres:latest"
    container_name: postgres_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - shared-local-net

  api:
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - shared-local-net

  web:
    networks:
      - shared-local-net

volumes:
  postgres_data:
    driver: local

networks:
  shared-local-net:
    driver: bridge