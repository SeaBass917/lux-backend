# Local development overrides
# Automatically loaded with docker-compose up
services:
  db:
    restart: always
    ports:
      - 5433:5432
    command: ["postgres", "-c", "fsync=off", "-c", "log_statement=all"]

  api:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.api
    container_name: api
    volumes:
      - ./server:/app/lux:rw
      - ./media:/app/media:rw
    ports:
      - "8080:8000"
    environment:
      - DEBUG=TRUE

  web:
    build:
      context: ./web
      dockerfile: ./docker/local/Dockerfile
    container_name: web
    volumes:
      - ./web/src:/app/src:ro
      - ./web/public:/app/public:ro
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
