# Production configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./docker/prod/Dockerfile.api
    restart: unless-stopped
  
  web:
    build:
      context: ./web
      dockerfile: ./docker/prod/Dockerfile
    restart: unless-stopped

  nginx:
    depends_on:
      - db
      - api
      - web
    networks:
      - shared-local-net
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - web-build:/usr/share/nginx/html:ro
    env_file:
      - .env
    entrypoint: /bin/sh -c "envsubst '$$DOMAIN_NAME_lux' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  web-build:
    driver: local
